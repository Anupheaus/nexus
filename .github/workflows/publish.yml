name: Publish Package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ─── PREPARE ──────────────────────────────────────────────────────────────────
jobs:
  prepare:
    name: Prepare
    concurrency:
      group: prepare-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/ci-setup
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─── VALIDATE ─────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm exec tsc --project tsconfig.ci.json --noEmit

      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Secret scan
        if: github.event_name != 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

# ─── TEST ─────────────────────────────────────────────────────────────────────
  test:
    name: Test
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: pnpm run test-ci

      - name: Publish coverage status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PCT="$(node -e "const fs=require('fs');const files=['coverage/coverage-summary.json','coverage/vitest/coverage-summary.json'];const file=files.find(p=>fs.existsSync(p));if(!file)process.exit(1);const pct=Math.round(JSON.parse(fs.readFileSync(file,'utf8')).total.lines.pct);if(!Number.isFinite(pct)||pct<0||pct>100)process.exit(1);process.stdout.write(String(pct));")" || exit 0
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context=coverage -f description="${PCT}%"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

# ─── E2E ──────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E tests
        run: pnpm run test:e2e

# ─── PUBLISH ──────────────────────────────────────────────────────────────────
  publish:
    name: Publish
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/ci-setup
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm run build

      - name: Check bundle size
        run: pnpm exec size-limit
        continue-on-error: true

      - name: Bump version
        uses: phips28/gh-action-bump-version@master
        with:
          version-type: patch
          commit-message: "CI: bumps version to {{version}} [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: pnpm pack

      - name: Publish
        run: pnpm publish $(ls *.tgz) --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
